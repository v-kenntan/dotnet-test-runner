tests:
- id: publish-15-framework-dependent
  category: Publish
  title: 15. Framework-dependent publish
  description: Create a console app, build it, run it, and publish it for the selected .NET SDK
  steps:
  - type: command
    command: dotnet new console -o f3
  - type: command
    command: cd f3
  - type: command
    command: dotnet build
  - type: command
    command: dotnet run
  - type: command
    command: dotnet publish -f {tfm}
  sort_order: 17
- id: publish-16-self-contained
  category: Publish
  title: 16. Self-contained publish
  description: Create a console app, build it, run it, and publish self-contained
    for multiple RIDs
  steps:
  - type: command
    command: dotnet new console -o f4
  - type: command
    command: cd f4
  - type: command
    command: dotnet build
  - type: command
    command: dotnet run
  - type: command
    command: dotnet publish -r win-x64 --sc -o pub
  - type: command
    command: cd pub
  - type: command
    command: dotnet f4.dll
  - type: command
    command: f4.exe
  sort_order: 18
