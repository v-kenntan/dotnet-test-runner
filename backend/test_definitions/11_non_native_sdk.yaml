tests:
- id: nonnative-sdk-console
  category: Non-native SDK
  title: a. C# console app
  description: Create, build and run a C# console app under a non-native SDK
  steps:
  - type: command
    command: dotnet --info
  - type: command
    command: dotnet new console -o test
  - type: command
    command: cd test
  - type: command
    command: dotnet build
  - type: command
    command: dotnet run
  sort_order: 45
- id: nonnative-sdk-wpf
  category: Non-native SDK
  title: b. WPF
  description: Create a WPF app under a non-native SDK, build and run it to verify the output window (the window auto-closes after 10s)
