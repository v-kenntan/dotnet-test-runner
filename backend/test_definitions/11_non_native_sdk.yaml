- id: nonnative-sdk-xunit
  category: Non-native SDK
  title: d. xUnit
  description: Create an xUnit project with passing, failing, and skipped tests under a non-native SDK; the test source is captured in Notepad
  steps:
  - type: command
    command: dotnet --info
  - type: command
    command: dotnet new xunit -o Myxunit
  - type: command
    command: cd Myxunit
  - type: write_file
    path: UnitTest1.cs
    screenshot: true
    label: xunit-UnitTest1
    content: |
      namespace Myxunit;

      public class UnitTest1
      {
          [Fact]
          public void TestPass()
          {
              Assert.True(true);
          }

          [Fact]
          public void TestFail()
          {
              Assert.True(false);
          }

          [Fact(Skip = "Skipping this test for now")]
          public void TestSkip()
          {
              Assert.True(true);
          }
      }
  - type: command
    command: dotnet build
  - type: command
    command: dotnet test
    expected_exit_code: 1
    # Exit code 1 also covers aborted runs and build errors, so require the
    # framework to have actually reported the one deliberately failing test.
    assert_output_matches:
    - '(?im)\bfailed:\s*1\b|^\s*Failed \S+ \['
  sort_order: 48
- id: nonnative-sdk-nunit
  category: Non-native SDK
  title: e. NUnit
  description: Create an NUnit project with passing, failing, and skipped tests under a non-native SDK; the test source is captured in Notepad
  steps:
  - type: command
    command: dotnet --info
  - type: command
    command: dotnet new nunit -o Myunit
  - type: command
    command: cd Myunit
  - type: write_file
    path: UnitTest1.cs
    screenshot: true
    label: nunit-UnitTest1
    content: |
      namespace Mynunit
      {
          public class Tests
          {
              [SetUp]
              public void Setup()
              {
              }

              [Test]
              public void Test_Pass()
              {
                  Assert.Pass("This test passed");
              }

              [Test]
              public void Test_Fail()
              {
                  Assert.Fail("This test failed");
              }

              [Test]
              [Ignore("This test is skipped")]
              public void Test_Skip()
              {
                  Assert.Pass("This test is skipped");
              }
          }
      }
  - type: command
    command: dotnet build
  - type: command
    command: dotnet test
    expected_exit_code: 1
    # Exit code 1 also covers aborted runs and build errors, so require the
    # framework to have actually reported the one deliberately failing test.
    assert_output_matches:
    - '(?im)\bfailed:\s*1\b|^\s*Failed \S+ \['
  sort_order: 49
- id: nonnative-sdk-mstest
  category: Non-native SDK
  title: f. MSTest
  description: Create an MSTest project with passing, failing, and inconclusive tests under a non-native SDK; the test source is captured in Notepad
  steps:
  - type: command
    command: dotnet --info
  - type: command
    command: dotnet new mstest -o Mymstest
  - type: command
    command: cd Mymstest
  - type: write_file
    path: Test1.cs
    screenshot: true
    label: mstest-Test1
    content: |
      namespace Mymstest;

      [TestClass]
      public sealed class Test1
      {
          [TestMethod]
          public void TestMethod1()
          {
              Assert.AreEqual(11, 11);
          }

          [TestMethod]
          public void TestMethod2()
          {
              Assert.AreEqual(12, 11);
          }

          [TestMethod]
          public void TestMethod3()
          {
              Assert.Inconclusive();
          }
      }
  - type: command
    command: dotnet build
  - type: command
    command: dotnet test
    expected_exit_code: 1
    # Exit code 1 also covers aborted runs and build errors, so require the
    # framework to have actually reported the one deliberately failing test.
    assert_output_matches:
    - '(?im)\bfailed:\s*1\b|^\s*Failed \S+ \['
  sort_order: 50
