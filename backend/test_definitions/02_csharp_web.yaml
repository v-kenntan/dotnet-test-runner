tests:
- id: cs-04a-web
  category: C# Web
  suites: [cli, sanity]
  title: 4a. Web
  description: Create a C# web app, start the server and verify the hosted site responds with Hello World
  steps:
  - type: command
    command: dotnet dev-certs https --trust
  - type: command
    command: dotnet new web -o myweb
  - type: command
    command: cd myweb
  - type: command
    command: dotnet build
  - type: command
    command: dotnet run --launch-profile https --urls https://localhost:7101
    long_running: true
    ready_pattern:
    - Now listening on
    - Application started
    verify_url: https://localhost:7101
    verify_contains: Hello World
    screenshot: true
    timeout: 300
  sort_order: 4
