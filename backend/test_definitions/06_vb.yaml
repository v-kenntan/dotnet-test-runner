- id: vb-13a-wpf
  category: VB
  title: 13a. WPF
  description: Create a VB WPF app, build and run it to verify the output window (the window auto-closes after 10s)
  steps:
  - type: command
    command: dotnet new wpf -o mywpf1 -lang vb
  - type: command
    command: cd mywpf1
  - type: command
    command: dotnet build
  - type: command
    command: dotnet run
    run_timeout: 10
    screenshot: true
  sort_order: 29
