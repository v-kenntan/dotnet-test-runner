tests:
- id: sample-01-build-run
  category: Sample Projects
  title: 14. Build and run a bundled sample project
  description: >-
    Copy the bundled sample console app and class libraries from
    test_assets/samples/<tfm> for the SDK under test. Then build the app and run
    it through both the dll and the apphost. This test requires a
    test_assets/samples/<tfm> folder for the selected SDK.
  steps:
  - type: command
    command: xcopy /e /i /q "{assets}\samples\{tfm}" sample
  - type: command
    command: cd sample\App
  - type: command
    command: dotnet build
  - type: command
    command: cd bin\Debug\{tfm}
  - type: command
    command: dotnet App.dll
    assert_output_contains:
    - Hello, World!
    - Hello from my Net472CL
  - type: command
    command: App.exe
    assert_output_contains:
    - Hello, World!
    - Hello from my Net472CL
  sort_order: 31
